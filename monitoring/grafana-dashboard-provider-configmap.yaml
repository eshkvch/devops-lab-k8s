apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Config Service
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
